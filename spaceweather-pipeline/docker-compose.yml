name: spaceweather
services:
  # ---------- Storage & Messaging ----------
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"               # host listener
    environment:
      # KRaft listeners: controller + two client listeners (host & docker)
      KAFKA_LISTENERS: CONTROLLER://:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT

      # KRaft single-node settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9091

      # Inter-broker traffic uses DOCKER listener
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER

      # Dev-friendly single-broker factors
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Optional: auto-create topics for a smoother first run
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks: [swnet]
    healthcheck:
      test: ["CMD", "bash", "-lc", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15

  kafka-setup:
    image: apache/kafka:latest
    container_name: kafka-setup
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - >
        mkdir -p /observability/logs &&
        touch /observability/logs/pipeline_events.log &&
        chmod 666 /observability/logs/pipeline_events.log &&
        printf "%s kafka-setup starting\n" "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> /observability/logs/pipeline_events.log &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9093
        --create --if-not-exists --topic healthcheck.raw &&
        printf "%s kafka-setup topic_created healthcheck.raw\n" "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> /observability/logs/pipeline_events.log &&
        echo "kafka topic healthcheck.raw ensured"
    networks: [swnet]
    volumes:
      - ./observability/logs:/observability/logs

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9093
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks: [swnet]

  # ---------- Airflow (LocalExecutor) + Postgres ----------
  postgres:
    image: postgres:15
    container_name: pg-airflow
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-airflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-airflow}
      - POSTGRES_DB=${POSTGRES_DB:-airflow}
    ports:
      - "5432:5432"
    networks: [swnet]
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-init:
    image: apache/airflow:2.10.2
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - >
        set -euo pipefail;
        mkdir -p /sources/dags /sources/logs /sources/plugins /sources/scripts /observability/logs &&
        touch /observability/logs/pipeline_events.log &&
        chmod 666 /observability/logs/pipeline_events.log &&
        chown -R 50000:0 /sources &&
        airflow db migrate &&
        (airflow users create -r Admin -u ${AIRFLOW_USER:-admin} -p ${AIRFLOW_PASSWORD:-admin} -f Admin -l Admin -e admin@example.com || true) &&
        bash /sources/scripts/init-connections.sh
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
      - _AIRFLOW_WWW_USER_USERNAME=${AIRFLOW_USER:-admin}
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_PASSWORD:-admin}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW_UID=50000
      - PIPELINE_EVENT_LOG=/observability/logs/pipeline_events.log
      - PIPELINE_EVENT_SOURCE=airflow-init
    user: "0:0"
    volumes:
      - ./airflow/dags:/sources/dags
      - airflow_logs:/sources/logs
      - ./airflow/plugins:/sources/plugins
      - ./airflow/scripts:/sources/scripts
      - ./observability/logs:/observability/logs
    networks: [swnet]

  airflow-webserver:
    image: apache/airflow:2.10.2
    container_name: airflow-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
      - AIRFLOW__METRICS__STATSD_ON=True
      - AIRFLOW__METRICS__STATSD_HOST=statsd-exporter
      - AIRFLOW__METRICS__STATSD_PORT=9125
      - AIRFLOW__METRICS__STATSD_PREFIX=airflow
      - PIPELINE_EVENT_LOG=/observability/logs/pipeline_events.log
      - PIPELINE_EVENT_SOURCE=airflow-web
    command: webserver
    user: "50000:0"
    ports:
      - "8081:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - datalake:/datalake
      - warehouse:/warehouse
      - ./observability/logs:/observability/logs
    networks: [swnet]

  airflow-scheduler:
    image: apache/airflow:2.10.2
    container_name: airflow-scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__METRICS__STATSD_ON=True
      - AIRFLOW__METRICS__STATSD_HOST=statsd-exporter
      - AIRFLOW__METRICS__STATSD_PORT=9125
      - AIRFLOW__METRICS__STATSD_PREFIX=airflow
      - PIPELINE_EVENT_LOG=/observability/logs/pipeline_events.log
      - PIPELINE_EVENT_SOURCE=airflow-scheduler
    command: scheduler
    user: "50000:0"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - datalake:/datalake
      - warehouse:/warehouse
      - ./observability/logs:/observability/logs
    networks: [swnet]

  # ---------- Spark ----------
  spark-master:
    image: spark:3.5.7-java17-python3   # Official library image (preferred)
    container_name: spark-master
    restart: unless-stopped
    command: ["/opt/spark/bin/spark-class","org.apache.spark.deploy.master.Master","--host","spark-master","--port","7077"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_WEBUI_PORT: 8082
      SPARK_WORKLOAD: "master"
    ports:
      - "7077:7077"   # Spark RPC
      - "8082:8082"   # Spark Master UI (mapped to 8082 on host)
    networks: [swnet]
    volumes:
      - datalake:/datalake
      - warehouse:/warehouse
      - ./spark/conf:/opt/bitnami/spark/conf

  # spark-worker:
  spark-worker:
    image: spark:3.5.7-java17-python3
    container_name: spark-worker
    restart: unless-stopped
    depends_on:
      - spark-master
    user: "0"
    command: [ "/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "4"
      SPARK_WORKER_MEMORY: "4g"
      SPARK_WORKER_WEBUI_PORT: 8083
      SPARK_WORKLOAD: "worker"
      SPARK_MASTER_URL: "spark://spark-master:7077"
    ports:
      - "8083:8083"   # Spark Worker UI (mapped to 8083 on host)
    networks: [swnet]
    volumes:
      - datalake:/datalake
      - warehouse:/warehouse
      - ./spark/conf:/opt/bitnami/spark/conf

  # ---------- dbt (DuckDB) ----------
  dbt:
    build:
      context: ./dbt
      dockerfile: Dockerfile
    container_name: dbt
    working_dir: /dbt
    volumes:
      - ./dbt:/dbt
      - warehouse:/warehouse
      - datalake:/datalake
    networks: [swnet]
    command: ["tail","-f","/dev/null"]

  # ---------- API (FastAPI stub) ----------
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api
    restart: unless-stopped
    environment:
      - DUCKDB_PATH=/warehouse/spaceweather.duckdb
    depends_on:
      - dbt
    ports:
      - "8000:8000"
    networks: [swnet]
    volumes:
      - warehouse:/warehouse
      - datalake:/datalake

  # ---------- Streamlit app ----------
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: app
    restart: unless-stopped
    environment:
      - API_BASE=http://api:8000
    depends_on:
      - api
    ports:
      - "8501:8501"
    networks: [swnet]
    volumes:
      - datalake:/datalake
      - warehouse:/warehouse

  # # HAPI data ingestion
  # ingestor:
  #   build:
  #     context: ./ingestor
  #     dockerfile: Dockerfile
  #   container_name: ingestor
  #   restart: unless-stopped
  #   environment:
  #     - HAPI_SERVER=https://hapi.spaceweather.knmi.nl/hapi
  #     - KAFKA_BOOTSTRAP=kafka:9093
  #     - LOG_LEVEL=INFO
  #     - INGESTOR_CONFIG=/app/datasets.yml
  #   depends_on:
  #     kafka:
  #       condition: service_healthy
  #   networks: [swnet]
  #   volumes:
  #     - ./ingestor/datasets.yml:/app/datasets.yml:ro
  #     - ./schemas:/app/schemas
  #     - ./ingestor/state:/app/state

  # --- Ingestor: FastAPI endpoint Airflow can call every 5 min ---
  ingestor:
    build:
      context: ./ingestor
      dockerfile: Dockerfile
    container_name: ingestor
    restart: unless-stopped
    environment:
      - API_BASE=http://api:8000
      - KAFKA_BOOTSTRAP=kafka:9093   # DOCKER listener
      - KAFKA_TOPIC=healthcheck.raw
      - STATSD_HOST=statsd-exporter
      - STATSD_PORT=9125
      - STATSD_PREFIX=pipeline.ingestor
      - PIPELINE_EVENT_LOG=/observability/logs/pipeline_events.log
      - PIPELINE_EVENT_SOURCE=ingestor
    depends_on:
      - api
      - kafka
      - statsd-exporter
    ports:
      - "9000:9000"
    networks: [swnet]
    volumes:
      - ./observability/logs:/observability/logs

  # --- Spark streaming consumer: Kafka -> Parquet (bronze) ---
  spark-stream:
    image: spark:3.5.7-java17-python3
    container_name: spark-stream
    depends_on:
      - kafka
      - spark-master
      - spark-worker
      - kafka-setup
      - statsd-exporter
    user: "0"
    restart: unless-stopped
    networks: [swnet]
    volumes:
      - ./spark/jobs:/jobs
      - datalake:/datalake
      - ./observability/logs:/observability/logs
    environment:
      - HOME=/tmp
      - STATSD_HOST=statsd-exporter
      - STATSD_PORT=9125
      - STATSD_PREFIX=pipeline.spark_stream
      - PIPELINE_EVENT_LOG=/observability/logs/pipeline_events.log
      - PIPELINE_EVENT_SOURCE=spark-stream
    command:
      [
        "/bin/bash",
        "-lc",
        "set -euo pipefail; mkdir -p /datalake/bronze/healthcheck /datalake/checkpoints/healthcheck && exec /opt/spark/bin/spark-submit --master spark://spark-master:7077 --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0 --conf spark.driver.extraJavaOptions=-Duser.home=/tmp --conf spark.executor.extraJavaOptions=-Duser.home=/tmp /jobs/stream_healthcheck_kafka.py"
      ]

  spark-hapi-stream:
    image: spark:3.5.7-java17-python3
    container_name: spark-hapi-stream
    depends_on:
      - kafka
      - spark-master
      - spark-worker
      - kafka-setup
      - statsd-exporter
    user: "0"
    restart: unless-stopped
    networks: [swnet]
    volumes:
      - ./spark/jobs:/jobs
      - datalake:/datalake
      - ./observability/logs:/observability/logs
    environment:
      - HOME=/tmp
      - STATSD_HOST=statsd-exporter
      - STATSD_PORT=9125
      - STATSD_PREFIX=pipeline.spark_hapi_stream
      - PIPELINE_EVENT_LOG=/observability/logs/pipeline_events.log
      - PIPELINE_EVENT_SOURCE=spark-hapi-stream
    command:
      [
        "/bin/bash",
        "-lc",
        "set -euo pipefail; mkdir -p /datalake/bronze/hapi /datalake/checkpoints/hapi && exec /opt/spark/bin/spark-submit --master local[2] --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0 --conf spark.driver.extraJavaOptions=-Duser.home=/tmp /jobs/stream_hapi_kafka.py"
      ]

  # --- dbt runner with an HTTP trigger for Airflow ---
  dbt-runner:
    build:
      context: ./dbt/runner
      dockerfile: Dockerfile
    container_name: dbt-runner
    restart: unless-stopped
    depends_on:
      - statsd-exporter
    environment:
      - DBT_PROJECT_DIR=/dbt/spaceweather
      - STATSD_HOST=statsd-exporter
      - STATSD_PORT=9125
      - STATSD_PREFIX=pipeline.dbt
      - PIPELINE_EVENT_LOG=/observability/logs/pipeline_events.log
      - PIPELINE_EVENT_SOURCE=dbt-runner
    ports:
      - "9001:9001"
    networks: [swnet]
    volumes:
      - ./dbt:/dbt
      - datalake:/datalake
      - warehouse:/warehouse
      - ./observability/logs:/observability/logs

  statsd-exporter:
    image: prom/statsd-exporter:v0.26.1
    container_name: statsd-exporter
    restart: unless-stopped
    command:
      - "--statsd.listen-udp=:9125"
      - "--statsd.listen-tcp=:9125"
      - "--web.listen-address=:9102"
    ports:
      - "9102:9102"
    networks: [swnet]

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: unless-stopped
    depends_on:
      - statsd-exporter
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [swnet]

  grafana:
    image: grafana/grafana:10.4.3
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    networks: [swnet]

networks:
  swnet:

volumes:
  kafka_data:
  pg_data:
  airflow_logs:
  datalake:
  warehouse:
  prometheus_data:
  grafana_data:
