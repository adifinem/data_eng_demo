server: https://hapi.spaceweather.knmi.nl/hapi
poll_interval: PT5M     # ISO-8601 duration
default_window: PT10M   # per-request span if dataset.window not provided

datasets:
  - id: solar_wind_mag_rt
    scope: rt
    parameters: ["*"]
    window: PT10M

  - id: kp_index
    scope: rt
    parameters: ["*"]
    window: PT6H

  - id: solar_wind_plasma_rt
    scope: rt
    parameters: ["*"]
    window: PT10M

  # Calibrated science backfill (optional for v1)
  - id: solar_wind_mag_ace_science
    scope: science
    parameters: ["*"]
    window: PT1H
